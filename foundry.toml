[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./runs" }]
# Dependency warnings only: OZ TransientSlot (2394), solady Ownable virtual modifiers (8429),
# forge-std assembly comments (2424, 4591).
ignored_error_codes = [2394, 2424, 4591, 8429]
# Test and script contracts embed whole contracts (a Verifier, the core) and exceed the size limits;
# they are never deployed. src/ warnings still fail.
ignored_warnings_from = ["test", "script", "lib"]

# The gas suite measures each call as its own transaction (intrinsic gas and calldata included)
# and is run on its own: `FOUNDRY_PROFILE=gas forge test`.
no_match_path = "test/gas/*"

[lint]
ignore = ["test/**/*.sol", "lib/**/*.sol"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[profile.gas]
isolate = true
no_match_path = "test/never/*"
match_path = "test/gas/*"
